groups:
  - name: flask-api-alerts
    rules:
      - alert: ServiceDown
        expr: up{job="flask-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Flask API is down"
          description: "Flask API не відповідає більше 1 хвилини"

      - alert: HighErrorRate
        expr: >
          sum(rate(flask_http_request_total{status=~"5.."}[5m]))
          / sum(rate(flask_http_request_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Відсоток помилок 5xx перевищує 10% протягом 5 хвилин"